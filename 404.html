<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | أوسار OSAR</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;600&family=Almarai:wght@400;700&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#FAF9F7;--fg:#121212;--dim:#6E675E;--line:rgba(18,18,18,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Almarai",Tahoma,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;width:100%;text-align:center;display:grid;gap:18px;justify-items:center}
.mark{width:110px}
.mark svg{width:100%;height:auto;display:block;overflow:visible}
.mark .b{transform-box:fill-box;transform-origin:bottom;animation:r .7s cubic-bezier(.2,.8,.2,1) both}
.mark .c{transform-box:fill-box;transform-origin:center;animation:o .8s cubic-bezier(.2,.8,.2,1) .2s both}
/* the half-disc is the missing piece: it hovers above, unplaced */
.mark .h{transform-box:fill-box;transform-origin:left bottom;animation:f 2.4s ease-in-out .6s infinite alternate;opacity:.25}
@keyframes r{from{transform:scaleY(0)}}
@keyframes o{from{transform:translateX(-140%) rotate(-220deg);opacity:0}}
@keyframes f{from{transform:translateY(-38%) rotate(-14deg)}to{transform:translateY(-30%) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.mark *{animation:none!important}}
.code{font-family:"Jost",sans-serif;font-size:14px;letter-spacing:.3em;color:var(--dim)}
h1{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:clamp(26px,5vw,36px);margin:0;line-height:1.35}
p{margin:0;color:var(--dim);font-size:16px;line-height:1.8}
.en{font-family:"Jost",sans-serif;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
a.btn{display:inline-flex;padding:10px 20px;border-radius:999px;border:1px solid var(--fg);text-decoration:none;font-size:14px;color:var(--fg)}
a.btn.s{background:var(--fg);color:var(--bg)}
a.btn:hover{background:var(--fg);color:var(--bg)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-family:"Readex Pro",sans-serif;font-size:15px;width:100%}
</style>
</head>
<body>
<main>
  <div class="mark"><svg viewBox="340 350 400 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="currentColor"><path class="b" d="M515 357 L733 720 L638 720 L472 432 Z"/><path class="h" d="M413 534 A108 108 0 0 1 523 720 Z"/><circle class="c" cx="412" cy="656" r="63"/></g></svg></div>
  <span class="code">404</span>
  <h1>هذي الصفحة ما انبنت بعد</h1>
  <p>الرابط اللي فتحته غير موجود أو تغيّر. نرجعك للأساس؟</p>
  <p class="en">This page doesn't exist.</p>
  <div class="btns">
    <a class="btn s" href="/">الصفحة الرئيسية</a>
    <a class="btn" href="/realestate.html">التسويق العقاري</a>
    <a class="btn" href="/social.html">السوشال ميديا</a>
    <a class="btn" href="/en/">English</a>
  </div>
  <div class="foot">من أساسٍ اليوم.. لمجتمعٍ يدوم</div>
</main>
</body>
</html>
