<style>
/* ===== ألوان الهوية — بدّلها هنا فقط لما توصل الهوية الجديدة ===== */
:root{
  --bg:#04070A;          /* الخلفية */
  --bg-2:#07110D;        /* توهّج الخلفية */
  --ink:#F2EFE8;         /* النص الأساسي */
  --ink-dim:#A8ADA6;     /* النص الثانوي */
  --accent:#C6F36B;      /* اللون المميز (لمجتمعٍ يدوم + الأقواس) */
  --accent-2:#6E8F2E;    /* درجة أغمق للمميز */
  --line:rgba(198,243,107,.38);
  --f-ar:"Readex Pro",system-ui,sans-serif;
  --f-en:"Jost","Readex Pro",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(60% 45% at 62% 4%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 70%),
    radial-gradient(80% 60% at 80% 85%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 70%),
    radial-gradient(120% 90% at 50% 50%,var(--bg-2),var(--bg) 70%)}
canvas#dust{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
/* glowing arcs */
.arcs{position:absolute;left:50%;top:12vh;width:min(34vh,62vw);transform:translateX(-50%);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 55%,transparent));animation:float 9s ease-in-out infinite}
.arcs path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.6,.1,.2,1) forwards}
.arcs path:nth-child(2){animation-delay:.35s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes float{0%,100%{transform:translateX(-50%) rotate(0deg)}50%{transform:translateX(-50%) translateY(-1.2vh) rotate(-3deg)}}
/* faint big mark */
.ghost{position:absolute;right:-12vh;bottom:6vh;width:min(62vh,90vw);color:var(--accent);opacity:.035}
.sweep{position:absolute;inset:auto 0 0 0;height:60vh;width:100%;pointer-events:none}
.sweep path{fill:none;stroke:url(#sg);stroke-width:1.4;opacity:.8}
/* layout */
header,footer{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,6vw,90px);direction:ltr;z-index:2}
header{top:clamp(28px,5.5vh,64px)}
.logo{width:clamp(110px,13vw,170px);color:var(--ink);display:block}
.tag{font-family:var(--f-en);font-weight:300;font-size:clamp(10px,1.1vw,14px);letter-spacing:.32em;color:var(--ink-dim);text-transform:uppercase}
main{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(20px,3.6vh,40px);text-align:center;z-index:2;padding:0 22px}
h1{font-weight:400;font-size:clamp(23px,5.2vw,64px);line-height:1.3;letter-spacing:0;white-space:nowrap}
h1 .acc{color:var(--accent)}
.soon{font-family:var(--f-en);font-weight:300;font-size:clamp(16px,2.2vw,30px);letter-spacing:.42em;padding-inline-start:.42em;color:var(--ink);direction:ltr}
.rise{opacity:0;transform:translateY(14px);filter:blur(8px);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.9s}.d2{animation-delay:1.4s}.d0{animation-delay:.3s}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
footer{bottom:clamp(22px,4.5vh,48px);gap:24px}
.social{display:flex;align-items:center;gap:12px;font-family:var(--f-en);font-size:13px;letter-spacing:.06em;color:var(--ink)}
.social a{color:var(--ink);display:inline-flex;transition:color .25s,transform .25s}
.social a:hover{color:var(--accent);transform:translateY(-2px)}
.social svg{width:19px;height:19px}
.social .sep{width:1px;height:16px;background:var(--ink-dim);opacity:.6}
.rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--accent) 20%,transparent));max-width:72%}
@media (max-width:640px){.tag{letter-spacing:.22em} .rule{max-width:40%} .ghost{right:-30vw;bottom:10vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .rise{opacity:1;transform:none;filter:none} .arcs path{stroke-dashoffset:0}}
